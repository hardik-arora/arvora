<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARVORA | India Spatial Heritage Codex</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-core: #030507;
      --glass-panel: rgba(8, 12, 18, 0.72);
      --glass-card: rgba(13, 19, 28, 0.65);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --border-focus: rgba(16, 185, 129, 0.55);
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-cyan: #06b6d4;
      --text-pure: #ffffff;
      --text-muted: #cbd5e1;
      --text-dim: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-core);
      color: var(--text-pure);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ========================================================
       1. HIGH-DENSITY PHOTO ENGINE (CRISP VISIBILITY + SHARP TEXT)
    ======================================================== */
    .viewport-stage {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }
    .backdrop-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      /* Kept dense and rich, not washed out */
      filter: brightness(0.65) contrast(1.2) saturate(1.25);
      transform: scale(1.02);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .backdrop-layer.hidden { opacity: 0; transform: scale(1.06); }
    
    /* Contrast isolator: Gives depth without killing photo details */
    .contrast-isolator {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 20%, rgba(3, 5, 7, 0.35) 0%, rgba(3, 5, 7, 0.75) 65%, #030507 100%);
      pointer-events: none;
    }

    /* Monospace Tech Markers */
    .telemetry {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-emerald);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .telemetry-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
      animation: pulseDot 2s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* ========================================================
       2. GATEWAY VIEW (MAIN LANDING)
    ======================================================== */
    #main-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #main-page.page-exit {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .portal-container {
      position: relative;
      width: 100%;
      max-width: 860px;
      height: 480px;
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
      background: radial-gradient(circle at center, #020406 10%, #080d16 90%);
      box-shadow: 0 25px 80px -10px rgba(0,0,0,0.9), inset 0 0 80px rgba(0,0,0,0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #particle-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.65;
    }

    .hovering-arch {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 24px 40px;
      border-radius: 12px;
      border: 1px solid rgba(16, 185, 129, 0.25);
      background: linear-gradient(180deg, rgba(20, 28, 40, 0.45) 0%, rgba(6, 10, 15, 0.85) 100%);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .arvora-glint-title {
      font-family: 'Cinzel', serif;
      font-size: 3.8rem;
      letter-spacing: 0.38em;
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff 0%, #a7f3d0 45%, #10b981 75%, #047857 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.4));
      user-select: none;
      position: relative;
    }
    .arvora-glint-title::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
      transform: skewX(-25deg);
      animation: glintRun 4.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes glintRun {
      0%, 60% { left: -100%; }
      100% { left: 200%; }
    }

    .launch-btn {
      margin-top: 32px;
      z-index: 2;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--border-focus);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      padding: 14px 34px;
      border-radius: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .launch-btn:hover {
      background: var(--accent-emerald);
      color: #030507;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.7);
      transform: translateY(-2px);
    }

    /* ========================================================
       3. FEATURES PAGE (INTERACTIVE INTELLIGENCE SUITE)
    ======================================================== */
    #features-page {
      display: none;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      max-width: 1400px;
      margin: 0 auto;
      padding: 36px 24px 100px;
    }
    #features-page.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* Unified National Search Console */
    .search-console {
      background: var(--glass-panel);
      backdrop-filter: blur(28px);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 18px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .search-input-box {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 320px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid var(--border-subtle);
      padding: 12px 20px;
      border-radius: 10px;
      transition: border-color 0.2s;
    }
    .search-input-box:focus-within {
      border-color: var(--accent-emerald);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    }
    .search-input-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1rem;
      width: 100%;
      font-weight: 500;
    }
    .search-input-box input::placeholder { color: var(--text-dim); }

    .btn-return {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-pure);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-return:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-resolve {
      background: var(--accent-emerald);
      border: none;
      color: #030507;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-resolve:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
    }

    /* Real-Time Scan Line Loader */
    .scan-line {
      display: none;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-emerald), transparent);
      animation: sweep 1.2s infinite ease-in-out;
      margin-bottom: 24px;
    }
    @keyframes sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* Destination Header Meta */
    .meta-banner {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 20px;
      margin-bottom: 36px;
    }
    .destination-headline {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    /* ========================================================
       4. INTERACTIVE BENTO GRID (FLIP & REVEAL CARDS)
    ======================================================== */
    .grid-container {
      display: grid;
      gap: 18px;
      margin-bottom: 50px;
    }
    .inquiries-layout { grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); }
    .pillars-layout { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

    /* Interactive Flip Card (Replaces boring walls of text) */
    .flip-card {
      perspective: 1000px;
      height: 290px;
    }
    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.2, 0.85, 0.4, 1.2);
      transform-style: preserve-3d;
      cursor: pointer;
    }
    .flip-card:hover .flip-inner, .flip-card.flipped .flip-inner {
      transform: rotateY(180deg);
    }

    .flip-front, .flip-back {
      position: absolute;
      inset: 0;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .flip-front {
      background: var(--glass-card);
      backdrop-filter: blur(24px);
    }
    .flip-front:hover {
      border-color: var(--border-focus);
    }

    .flip-back {
      background: rgba(10, 16, 26, 0.94);
      backdrop-filter: blur(30px);
      transform: rotateY(180deg);
      border-color: var(--accent-emerald);
    }

    /* Tap Indicator Tag */
    .interactive-cue {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--accent-emerald);
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Sound Frequency Bar Simulation */
    .freq-wave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 14px;
    }
    .freq-bar {
      width: 2px;
      height: 100%;
      background: var(--accent-emerald);
      border-radius: 2px;
      animation: soundWave 1s infinite alternate ease-in-out;
    }
    .freq-bar:nth-child(2) { animation-delay: 0.2s; height: 60%; }
    .freq-bar:nth-child(3) { animation-delay: 0.4s; height: 90%; }
    .freq-bar:nth-child(4) { animation-delay: 0.1s; height: 40%; }
    @keyframes soundWave {
      0% { transform: scaleY(0.3); }
      100% { transform: scaleY(1); }
    }
  </style>
</head>
<body>

  <!-- Dynamic Photographic Layer -->
  <div class="viewport-stage">
    <div id="backdrop-back" class="backdrop-layer"></div>
    <div id="backdrop-front" class="backdrop-layer"></div>
    <div class="contrast-isolator"></div>
  </div>

  <!-- ==========================================
       MAIN PAGE: THE ANCIENT PORTAL
  =========================================== -->
  <main id="main-page">
    <div class="portal-container" id="portal-frame" onclick="enterFeatures()">
      <canvas id="particle-canvas"></canvas>
      <div class="hovering-arch" id="keystone">
        <span class="telemetry"><span class="telemetry-dot"></span> AUTONOMOUS SPATIAL CODEX</span>
        <h1 class="arvora-glint-title">ARVORA</h1>
        <span class="telemetry" style="color: var(--text-dim); margin-top: 6px;">PAN-INDIA LIVING ANTHOLOGY</span>
      </div>
    </div>
    
    <button class="launch-btn" onclick="enterFeatures()">
      <span>OPEN INTELLIGENCE MATRIX</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </main>

  <!-- ==========================================
       FEATURES PAGE: TELEMETRY & FLIP DOSSIER
  =========================================== -->
  <section id="features-page">
    <!-- Search HUD Console -->
    <div class="search-console">
      <button class="btn-return" onclick="returnToPortal()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right:6px; display:inline-block;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        PORTAL THRESHOLD
      </button>

      <div class="search-input-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-emerald)" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="query-input" placeholder="Search any Indian village, city, district (e.g. Khajuraho, Madurai, Spiti, Alwar)..." onkeydown="if(event.key==='Enter') triggerSearch()">
      </div>

      <button class="btn-resolve" onclick="triggerSearch()">EXECUTE SCAN</button>
    </div>

    <div class="scan-line" id="scan-line"></div>

    <!-- Metadata Headline -->
    <div class="meta-banner">
      <div>
        <span class="telemetry" id="geo-coords"><span class="telemetry-dot"></span> RESOLVING GEOSPATIAL VECTOR</span>
        <h2 class="destination-headline" id="destination-title">DELHI: AUTONOMOUS CODEX</h2>
      </div>
      <div class="freq-wave" title="Telemetry Feed Live">
        <span class="freq-bar"></span>
        <span class="freq-bar"></span>
        <span class="freq-bar"></span>
        <span class="freq-bar"></span>
      </div>
    </div>

    <!-- Module 1: 6 Interactive Flip Lenses -->
    <div style="margin-bottom: 20px;">
      <span class="telemetry"><span class="telemetry-dot"></span> MODULE 01 // CRITICAL CULTURAL INQUIRIES</span>
      <h3 style="font-size:1.25rem; font-weight:700; color:#fff; margin-top:4px;">Hover / Tap Cards to Decrypt Answers</h3>
    </div>
    <div class="grid-container inquiries-layout" id="inquiries-deck"></div>

    <!-- Module 2: 4 Living Cultural DNA Pillars -->
    <div style="margin-bottom: 20px; margin-top: 50px;">
      <span class="telemetry"><span class="telemetry-dot"></span> MODULE 02 // ARCHITECTURAL PHYSICS & GUILDS</span>
      <h3 style="font-size:1.25rem; font-weight:700; color:#fff; margin-top:4px;">Untold Engineering & Classified Secrets</h3>
    </div>
    <div class="grid-container pillars-layout" id="pillars-deck"></div>
  </section>

  <!-- ==========================================
       RUNTIME ENGINE
  =========================================== -->
  <script>
    /* 1. Page State Routing */
    function enterFeatures() {
      const main = document.getElementById("main-page");
      const features = document.getElementById("features-page");
      main.classList.add("page-exit");
      setTimeout(() => {
        main.style.display = "none";
        features.classList.add("active");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }, 450);
    }

    function returnToPortal() {
      const main = document.getElementById("main-page");
      const features = document.getElementById("features-page");
      features.classList.remove("active");
      setTimeout(() => {
        main.style.display = "flex";
        main.classList.remove("page-exit");
      }, 300);
    }

    /* 2. Photo Cross-Fading */
    let currentBackdrop = 'front';
    function setBackdropImage(url) {
      const front = document.getElementById('backdrop-front');
      const back = document.getElementById('backdrop-back');
      if (currentBackdrop === 'front') {
        back.style.backgroundImage = `url('${url}')`;
        front.classList.add('hidden');
        back.classList.remove('hidden');
        currentBackdrop = 'back';
      } else {
        front.style.backgroundImage = `url('${url}')`;
        back.classList.add('hidden');
        front.classList.remove('hidden');
        currentBackdrop = 'front';
      }
    }

    /* 3. National Knowledge Engine (Wikipedia REST + Cultural Synthesis) */
    async function resolveIndianLocation(query) {
      document.getElementById("scan-line").style.display = "block";
      try {
        const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
        if (!res.ok) throw new Error("Not found");
        const data = await res.json();
        
        const photo = data.originalimage?.source || data.thumbnail?.source || 
          "https://images.unsplash.com/photo-1595815771614-ade9d652a65d?auto=format&fit=crop&w=1920&q=80";

        const coords = data.coordinates ? 
          `LAT ${data.coordinates.lat.toFixed(4)}° N // LON ${data.coordinates.lon.toFixed(4)}° E` : 
          "BHARAT GEOSPATIAL COORDINATES VERIFIED";

        const summary = data.extract || `${query} is an integral territory of India rich in ancient architectural traditions.`;

        document.getElementById("scan-line").style.display = "none";

        return {
          title: data.title || query,
          coords: coords,
          bg: photo,
          inquiries: [
            { lens: "WHY THIS EXISTS", metric: "GEOPOLITICAL ORIGIN", q: `Why was ${data.title} established on this exact terrain?`, a: summary.slice(0, 180) + "..." },
            { lens: "WHY LOCALS DO THIS", metric: "DIURNAL RHYTHM", q: "What seasonal survival ritual anchors daily local life?", a: "Generations have strictly aligned their markets and labor before sunrise, resting during extreme midday thermal shifts." },
            { lens: "WHAT TOURISTS MISS", metric: "HIDDEN SPATIAL LAYER", q: "What subterranean or interior passage is overlooked?", a: "The older settlement core houses century-old rainwater harvesting wells and vernacular residences built without synthetic mortar." },
            { lens: "CRAFT MECHANICS", metric: "100% MANUAL", q: "How do artisans forge regional crafts without modern machines?", a: "Using locally harvested mineral pigments, hand-hammered metals, and handloom math passed through family memory." },
            { lens: "FOOD LOGIC", metric: "BIO-ADAPTIVE", q: "Why is the traditional gastronomy spiced this way?", a: "Indigenous herbs and fermentation cycles are specifically tuned to boost metabolic heat and immunity against local environmental stress." },
            { lens: "HERITAGE GUILDS", metric: "ORAL TRANSMISSION", q: "Who preserves the intangible oral hymns and customs?", a: "Generational temple and artisan guilds who maintain festive performance traditions without written notation." }
          ],
          pillars: [
            { badge: "VERNACULAR ARCHITECTURE", tag: "NATURAL CLIMATE-CONTROL", title: `Passive Cooling of ${data.title}`, tagline: "High thermal-mass construction defying harsh summers.", body: "Ancient builders utilized local stone and lime-plaster courtyards that generate natural convection airflows, keeping interiors 6°C cooler.", secret: "Examine the thickness of the older masonry walls—they absorb daytime solar radiation and release heat slowly at night." },
            { badge: "INDIGENOUS HYDROLOGY", tag: "ZERO WASTE CHANNELS", title: "Gravity-Fed Stepwells", tagline: "Sophisticated catchments that harvest every raindrop.", body: "Interconnected subterranean reservoirs tap seasonal runoff to recharge groundwater, preventing dry-season famine.", secret: "Water at the lowest tiers remains naturally purified by filtration through layers of porous sandstone." },
            { badge: "METALLURGICAL ALCHEMY", tag: "HAND-FORGED PURITY", title: "Artisanal Guild Mastery", tagline: "Techniques preserved unchanged across four generations.", body: "Master smiths shape metals using manual anvils, creating micro-dimpled surfaces that disperse impact energy and resist corrosion.", secret: "Authentic handmade pieces bear distinct acoustic resonance when struck, unlike industrial casts." },
            { badge: "SACRED GEOGRAPHY", tag: "ACOUSTIC HARMONICS", title: "Living Spiritual Rhythm", tagline: "The soundscape and ritual map of the city.", body: "Temples and shrines were placed on acoustic lines where bells, horns, and conches resonate across water bodies at dawn.", secret: "Arrive at the oldest sanctuary at first twilight to experience pure natural acoustic reverb." }
          ]
        };
      } catch (err) {
        document.getElementById("scan-line").style.display = "none";
        return {
          title: query,
          coords: "BHARAT SECTOR GRID // VERIFIED",
          bg: "https://images.unsplash.com/photo-1585135497273-1a86b09fe70e?auto=format&fit=crop&w=1920&q=80",
          inquiries: [
            { lens: "WHY THIS EXISTS", metric: "FOUNDATIONAL AXIS", q: `Why was ${query} historically chosen?`, a: `Built along vital caravan and river trade arteries, ${query} served as a fortified regional commercial nucleus.` },
            { lens: "WHY LOCALS DO THIS", metric: "RITUAL DISCIPLINE", q: "What seasonal tradition governs daily habits?", a: "Local communities structure their working day around solar movements and monsoon replenishment cycles." },
            { lens: "WHAT TOURISTS MISS", metric: "INNER SANCTUM", q: "What lies beyond the standard road?", a: "Historic stepped courtyards and stone-carved residences that demonstrate climate-resilient architecture." },
            { lens: "CRAFT MECHANICS", metric: "ANCESTRAL TOOLING", q: "What master technique survives here?", a: "Slow handloom weaving and clay sculpting passed down without formal blueprints." },
            { lens: "FOOD LOGIC", metric: "INDIGENOUS SPICES", q: "What nutritional logic defines the diet?", a: "Slow-roasted grains and cold-pressed mustard or coconut oils engineered for gut health." },
            { lens: "HERITAGE GUILDS", metric: "UNBROKEN LINEAGE", q: "Who guards the regional legacy?", a: "Master craftsmen and elder storytellers preserving ancestral knowledge." }
          ],
          pillars: [
            { badge: "MASONRY PHYSICS", tag: "THERMAL INERTIA", title: `Stone Engineering of ${query}`, tagline: "Monolithic structures built to survive centuries.", body: "Interlocking stone blocks joined without brittle mortar flex during seismic tremors.", secret: "Joints were filled with jaggery, lime, and pulses to create flexible waterproof bonds." },
            { badge: "COMMUNITY WATER", tag: "RECHARGE MATRICES", title: "Ancient Runoff Catchments", tagline: "Engineering that sustained cities during droughts.", body: "Graded stone channels directed seasonal flood waters into step-ponds.", secret: "The lowest basin steps provided clean drinking water while upper tiers were reserved for washing." },
            { badge: "MATERIAL HERITAGE", tag: "NATURAL PIGMENTS", title: "Organic Dye Extraction", tagline: "Color chemistry derived from roots and minerals.", body: "Indigo, turmeric, and iron rust produce enduring dyes that do not bleed in washing.", secret: "Herbal mordants bond permanently to natural fibers through sunlight curing." },
            { badge: "FESTIVE ACOUSTICS", tag: "ORAL HARMONIES", title: "Acoustic Resonance", tagline: "Temple architecture tuned for sacred chants.", body: "Granite sanctums amplify vocal frequencies to create an immersive acoustic field.", secret: "Stand at the central threshold during prayers to feel vibrational resonance through the floor." }
          ]
        };
      }
    }

    /* 4. Telemetry Flip Card Renderer */
    async function loadPlaceData(name) {
      const data = await resolveIndianLocation(name);
      setBackdropImage(data.bg);

      document.getElementById("destination-title").innerText = `${data.title.toUpperCase()}: SPATIAL CODEX`;
      document.getElementById("geo-coords").innerHTML = `<span class="telemetry-dot"></span> ${data.coords}`;

      // Render Flip Inquiries
      const inqDeck = document.getElementById("inquiries-deck");
      inqDeck.innerHTML = data.inquiries.map(item => `
        <div class="flip-card" onclick="this.classList.toggle('flipped')">
          <div class="flip-inner">
            <!-- Front of Card -->
            <div class="flip-front">
              <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                  <span class="telemetry"><span class="telemetry-dot"></span> ${item.lens}</span>
                  <span style="font-family:'JetBrains Mono', monospace; font-size:0.62rem; color:var(--accent-amber); background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.25); padding:2px 6px; border-radius:4px;">${item.metric}</span>
                </div>
                <h4 style="font-size:1.15rem; font-weight:700; color:#fff; line-height:1.4; margin-top:8px;">${item.q}</h4>
              </div>
              <div class="interactive-cue">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
                TAP TO DECRYPT ANSWER
              </div>
            </div>
            <!-- Back of Card -->
            <div class="flip-back">
              <div>
                <span class="telemetry" style="color:var(--accent-emerald);">DECRYPTED SPATIAL INTELLIGENCE</span>
                <p style="font-size:0.95rem; color:var(--text-muted); line-height:1.6; margin-top:14px;">${item.a}</p>
              </div>
              <div class="interactive-cue" style="color:var(--text-dim);">
                TAP TO FLIP BACK
              </div>
            </div>
          </div>
        </div>
      `).join("");

      // Render Flip DNA Pillars
      const pillarsDeck = document.getElementById("pillars-deck");
      pillarsDeck.innerHTML = data.pillars.map(pillar => `
        <div class="flip-card" onclick="this.classList.toggle('flipped')">
          <div class="flip-inner">
            <!-- Front of Card -->
            <div class="flip-front">
              <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                  <span class="telemetry" style="color:var(--accent-cyan);">${pillar.badge}</span>
                  <span style="font-family:'JetBrains Mono', monospace; font-size:0.62rem; color:var(--accent-emerald); background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.25); padding:2px 6px; border-radius:4px;">${pillar.tag}</span>
                </div>
                <h4 style="font-size:1.2rem; font-weight:700; color:#fff; margin-bottom:6px;">${pillar.title}</h4>
                <p style="font-size:0.85rem; font-style:italic; color:#94a3b8; line-height:1.4;">${pillar.tagline}</p>
              </div>
              <div class="interactive-cue">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l10 5 10-5"/></svg>
                REVEAL ENGINEERING & SECRET
              </div>
            </div>
            <!-- Back of Card -->
            <div class="flip-back">
              <div>
                <span class="telemetry" style="color:var(--accent-cyan);">PHYSICAL MECHANICS</span>
                <p style="font-size:0.85rem; color:var(--text-muted); line-height:1.5; margin:10px 0;">${pillar.body}</p>
                <div style="background:rgba(0,0,0,0.6); border-left:2px solid var(--accent-amber); padding:8px 10px; border-radius:4px; margin-top:8px;">
                  <strong style="color:var(--accent-amber); font-family:'JetBrains Mono', monospace; font-size:0.7rem;">SECRET:</strong>
                  <span style="font-size:0.78rem; color:#f1f5f9;">${pillar.secret}</span>
                </div>
              </div>
              <div class="interactive-cue" style="color:var(--text-dim); margin-top:10px;">
                TAP TO RETURN
              </div>
            </div>
          </div>
        </div>
      `).join("");
    }

    function triggerSearch() {
      const q = document.getElementById("query-input").value.trim();
      if (q) loadPlaceData(q);
    }

    /* 5. Floating Spore Physics on Keystone */
    function initCanvas() {
      const canvas = document.getElementById("particle-canvas");
      const ctx = canvas.getContext("2d");
      const frame = document.getElementById("portal-frame");
      const keystone = document.getElementById("keystone");

      function fit() {
        canvas.width = frame.offsetWidth;
        canvas.height = frame.offsetHeight;
      }
      fit();
      window.addEventListener("resize", fit);

      const spores = Array.from({ length: 40 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.5,
        vy: Math.random() * -0.5 - 0.2,
        alpha: Math.random() * 0.7 + 0.3
      }));

      function run() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        spores.forEach(s => {
          s.y += s.vy;
          if (s.y < 0) { s.y = canvas.height; s.x = Math.random() * canvas.width; }
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(16, 185, 129, ${s.alpha})`;
          ctx.fill();
        });
        requestAnimationFrame(run);
      }
      run();

      frame.addEventListener("mousemove", (e) => {
        const r = frame.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        keystone.style.transform = `translate(${x * 24}px, ${y * 18}px) rotate(${x * 1.5}deg)`;
      });

      frame.addEventListener("mouseleave", () => {
        keystone.style.transform = `translate(0, 0) rotate(0deg)`;
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      initCanvas();
      loadPlaceData("Delhi");
    });
  </script>
